<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Smooth Scroll & Animations -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <link rel="stylesheet" href="styles.css?v=3">
</head>
<body>
    <!-- Custom Cursor -->
    <div id="cursor-dot"></div>
    <div id="cursor-circle"></div>

    <!-- Scroll Progress Indicator -->
    <div id="scroll-progress"></div>

    <!-- LOADER -->
    <div id="loader-wrapper">
        <div class="loader-container">
            <div class="loader">
              <svg viewBox="0 0 80 80">
                <circle r="32" cy="40" cx="40" id="test"></circle>
              </svg>
            </div>
            <div class="loader triangle">
              <svg viewBox="0 0 86 80">
                <polygon points="43 8 79 72 7 72"></polygon>
              </svg>
            </div>
            <div class="loader">
              <svg viewBox="0 0 80 80">
                <rect height="64" width="64" y="8" x="8"></rect>
              </svg>
            </div>
        </div>
    </div>

    <!-- TOP HORIZONTAL SCROLL WRAPPER -->
    <div id="top-horizontal-wrapper" style="overflow: hidden; width: 100vw; background: #000;">
        <div id="top-horizontal-container" style="display: flex; width: 200vw; will-change: transform; align-items: flex-start;">
            
            <!-- 1. Hero.mp4 (Left Side) -->
            <section class="portfolio-content" style="width: 100vw; height: 100vh; flex-shrink: 0; position: relative;">
                <video class="scroll-video" src="Hero.mp4" autoplay loop muted playsinline style="width: 100%; height: 100%; object-fit: cover; display: block;"></video>
            </section>

            <!-- Right Side Column (About Me + 3.mp4) -->
            <div style="width: 100vw; flex-shrink: 0; display: flex; flex-direction: column;">
                
                <!-- 2. 2.JPG.jpeg (About Me Separator) -->
                <section class="separator marquee">
                    <div class="marquee-track" id="track-1">
                        <div class="marquee-half">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                        </div>
                        <div class="marquee-half">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                            <img src="2.JPG.jpeg" alt="About Me 1">
                        </div>
                    </div>
                </section>

                <!-- 3. 3.mp4 -->
                <section class="portfolio-content" style="position: relative;">
                    <video class="scroll-video" src="3.mp4" muted playsinline preload="metadata" style="width: 100%; height: auto; display: block;"></video>
                </section>
                
            </div>

        </div>
    </div>

    <!-- 4. 4.JPG.jpeg (Separator) -->
    <section class="separator marquee">
        <div class="marquee-track" id="track-2">
            <div class="marquee-half">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
            </div>
            <div class="marquee-half">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
                <img src="4.JPG.jpeg" alt="Separator 2">
            </div>
        </div>
    </section>

    <!-- 5. 5.MP4 -->
    <section class="portfolio-content">
        <video class="scroll-video" src="5.MP4" muted playsinline preload="metadata"></video>
    </section>

    <!-- 6.0.jpeg (Separator) -->
    <section class="separator marquee">
        <div class="marquee-track" id="track-3">
            <div class="marquee-half">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
            </div>
            <div class="marquee-half">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
                <img src="6.0.jpeg" alt="Separator 3">
            </div>
        </div>
    </section>

    <!-- HORIZONTAL SCROLL WRAPPER -->
    <div id="horizontal-wrapper" style="overflow: hidden; width: 100vw; height: 100vh; background: #000;">
        <div id="horizontal-container" style="display: flex; width: 200vw; height: 100vh; will-change: transform;">
            
            <!-- 6. Projects Section -->
            <section id="section-6" class="portfolio-section" style="width: 100vw; height: 100vh; flex-shrink: 0; position: relative;">
                <div class="projects-grid">
                    <!-- Clickable projects -->
                    <div class="project-item clickable" data-project="real-estate">
                        <img src="6.1.png" alt="01 Real Estate">
                    </div>
                    <!-- Clickable projects -->
                    <div class="project-item clickable" data-project="wellness-brand">
                        <img src="6.2.png" alt="02 Wellness Brand">
                    </div>
                    <div class="project-item clickable" data-project="cafe-branding">
                        <img src="6.3.png" alt="03 Cafe Branding">
                    </div>
                    <!-- Clickable projects -->
                    <div class="project-item clickable" data-project="brand-revamp">
                        <img src="6.4.png" alt="04 Brand Revamp">
                    </div>
                </div>
                
                <!-- CTA Hint for Recruiters -->
                <div class="projects-hint">
                    Click a project to view the full case study
                </div>
            </section>

            <!-- 7. Final Section -->
            <section class="portfolio-content" id="final-section" style="width: 100vw; flex-shrink: 0; position: relative; height: 100vh; box-sizing: border-box; border-bottom: 2px solid rgba(255, 255, 255, 0.1);">
                <video class="scroll-video" src="7.mp4" muted playsinline preload="metadata" style="width: 100%; height: 100%; object-fit: cover;"></video>
                
                <!-- Bottom Right CTAs -->
                <div class="bottom-right-ctas">
                    <a href="tel:+64226159728" class="cta-link clickable" aria-label="Call">
                        <div class="cta-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 00-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 1.01-.63 1.01-1.18v-3.45c0-.54-.45-.99-.99-.99z"/></svg>
                        </div>
                    </a>
                    <a href="mailto:parkhigulati@gmail.com" class="cta-link clickable" aria-label="Email">
                        <div class="cta-icon">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        </div>
                    </a>
                </div>
            </section>

        </div>
    </div>

    <!-- Copyright Strip -->
    <footer class="copyright-strip">
        <p>&copy; 2026 Parkhi Gulati. All Rights Reserved.</p>
    </footer>

    <!-- Case Study SPA Overlay -->
    <div id="case-study-overlay" class="hidden" data-lenis-prevent>
        <button id="close-case-study" aria-label="Close Case Study">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
        </button>
        <!-- Reusing the beautiful triangle loader you already have -->
        <div id="case-study-spinner" class="loader triangle" style="position: absolute; top: 50%; left: 50%; margin: 0; transform: translate(-50%, -50%); display: none;">
            <svg viewBox="0 0 86 80">
                <polygon points="43 8 79 72 7 72"></polygon>
            </svg>
        </div>
        <div id="case-study-content" style="opacity: 0; transition: opacity 0.5s ease;">
            <!-- Images will be injected here dynamically -->
        </div>
    </div>

    <script>
        // GSAP & ScrollTrigger Setup
        gsap.registerPlugin(ScrollTrigger);

        // Initialize Lenis Smooth Scroll
        const lenis = new Lenis({
            duration: 1.2,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            direction: 'vertical',
            gestureDirection: 'vertical',
            smooth: true,
        });

        // Sync Lenis and ScrollTrigger
        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => {
            lenis.raf(time * 1000);
        });
        gsap.ticker.lagSmoothing(0);

        // Scroll Progress Bar
        const progressBar = document.getElementById('scroll-progress');
        lenis.on('scroll', (e) => {
            progressBar.style.width = `${e.progress * 100}%`;
        });

        // Only apply horizontal GSAP sequences on Desktop
        let mm = gsap.matchMedia();
        mm.add("(min-width: 769px)", () => {
            // Top Horizontal Scroll Sequence for Hero and 3.mp4
            const topHorizontalContainer = document.getElementById('top-horizontal-container');
            let topAnim = gsap.to(topHorizontalContainer, {
                x: () => -(topHorizontalContainer.scrollWidth - window.innerWidth) + "px",
                ease: "none" // Native linear scrub
            });

            ScrollTrigger.create({
                trigger: "#top-horizontal-wrapper",
                pin: true,
                start: "top top",
                end: "+=1200", 
                animation: topAnim,
                scrub: 1 // Pure manual scroll, no auto-play or snap
            });

            // Bottom Horizontal Scroll Sequence for Section 6 and 7
            const horizontalContainer = document.getElementById('horizontal-container');
            let bottomAnim = gsap.to(horizontalContainer, {
                x: () => -(horizontalContainer.scrollWidth - window.innerWidth) + "px",
                ease: "none" // Native linear scrub
            });

            ScrollTrigger.create({
                trigger: "#horizontal-wrapper",
                pin: true,
                start: "top top",
                end: "+=1200", 
                animation: bottomAnim,
                scrub: 1 // Pure manual scroll, no auto-play or snap
            });
        });

        // Custom Cursor Logic
        const cursorDot = document.getElementById('cursor-dot');
        const cursorCircle = document.getElementById('cursor-circle');
        let mouseX = 0, mouseY = 0;
        let circleX = 0, circleY = 0;
        
        // Only activate custom cursor on desktop
        if (window.innerWidth > 768) {
            document.body.classList.add('custom-cursor-active');
            
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
                cursorDot.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
            });

            const renderCursor = () => {
                circleX += (mouseX - circleX) * 0.15;
                circleY += (mouseY - circleY) * 0.15;
                cursorCircle.style.transform = `translate3d(${circleX}px, ${circleY}px, 0)`;
                requestAnimationFrame(renderCursor);
            };
            requestAnimationFrame(renderCursor);

            // Re-bind hover logic function (can be called after dynamic DOM changes)
            const bindCursorHovers = () => {
                const interactables = document.querySelectorAll('a, button, .clickable, input, textarea');
                interactables.forEach(el => {
                    // Prevent multiple bindings
                    if (!el.dataset.cursorBound) {
                        el.dataset.cursorBound = 'true';
                        el.addEventListener('mouseenter', () => cursorCircle.classList.add('cursor-hover'));
                        el.addEventListener('mouseleave', () => cursorCircle.classList.remove('cursor-hover'));
                    }
                });
            };
            // Initial bind
            bindCursorHovers();
            // Bind again after a delay in case elements take time to render
            setTimeout(bindCursorHovers, 1000);
        }

        // Force page to scroll to top on reload so GSAP doesn't prematurely trigger
        if ('scrollRestoration' in history) {
            history.scrollRestoration = 'manual';
        }

        // Handle initial loader fade out
        window.addEventListener('load', () => {
            const loaderWrapper = document.getElementById('loader-wrapper');
            if (loaderWrapper) {
                // Add hidden class to trigger CSS fade-out transition
                loaderWrapper.classList.add('hidden');
                
                // Wait for the transition to finish before removing from DOM flow
                setTimeout(() => {
                    loaderWrapper.style.display = 'none';
                    window.scrollTo(0, 0); // Guarantee start at absolute top
                }, 500); // 0.5s matches the CSS transition duration
            } else {
                window.scrollTo(0, 0);
            }
        });

        document.addEventListener("DOMContentLoaded", () => {
            const scrollVideos = document.querySelectorAll('.scroll-video');
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    
                    // When the video comes into view
                    if (entry.isIntersecting) {
                        video.play().catch(err => console.log("Video play failed:", err));
                    } else {
                        // Pause the video when out of view so it doesn't play in the background
                        video.pause();
                    }
                });
            }, {
                threshold: 0.25 // Trigger when 25% of the video is visible
            });
            
            scrollVideos.forEach(video => {
                observer.observe(video);
            });

            // SPA Logic for Section 6 Case Studies
            const caseStudyOverlay = document.getElementById('case-study-overlay');
            const caseStudyContent = document.getElementById('case-study-content');
            const closeBtn = document.getElementById('close-case-study');
            
            // Define project assets based on actual directory contents
            const projects = {
                'real-estate': [
                    'Real estate/LOGO DESIGNING - 1.jpg',
                    'Real estate/LOGO DESIGNING - 2.jpg',
                    'Real estate/LOGO DESIGNING - 3.jpg',
                    'Real estate/LOGO DESIGNING - 4.jpg',
                    'Real estate/LOGO DESIGNING - 5.jpg',
                    'Real estate/LOGO DESIGNING - 6.jpg',
                    'Real estate/LOGO DESIGNING - 7.jpg',
                    'Real estate/LOGO DESIGNING - 8.jpg',
                    'Real estate/LOGO DESIGNING - 9.jpg',
                    'Real estate/LOGO DESIGNING - 10.jpg',
                    'Real estate/LOGO DESIGNING - 11.jpg',
                    'Real estate/LOGO DESIGNING - 12.jpg',
                    'Real estate/LOGO DESIGNING - 13.jpg',
                    'Real estate/LOGO DESIGNING - 14.jpg',
                    'Real estate/LOGO DESIGNING - 15.jpg'
                ],
                'wellness-brand': [
                    'Wellness brand/1.jpg',
                    'Wellness brand/2.jpg',
                    'Wellness brand/3.jpeg',
                    'Wellness brand/4.jpg',
                    'Wellness brand/5.jpg'
                ],
                'cafe-branding': [
                    'Cafe branding/1.jpg',
                    'Cafe branding/2.jpg',
                    'Cafe branding/3.mp4',
                    'Cafe branding/4.jpg',
                    'Cafe branding/5.jpg',
                    'Cafe branding/6.jpg',
                    'Cafe branding/7.jpg',
                    'Cafe branding/8.jpg'
                ],
                'brand-revamp': [
                    'Brand revamp/The Rebrand - 1.jpg',
                    'Brand revamp/The Rebrand - 2.jpg',
                    'Brand revamp/The Rebrand - 3.jpg',
                    'Brand revamp/The Rebrand - 4.jpg',
                    'Brand revamp/The Rebrand - 5.jpg',
                    'Brand revamp/The Rebrand - 6.jpg',
                    'Brand revamp/The Rebrand - 7.jpg'
                ]
            };

            const projectItems = document.querySelectorAll('.project-item.clickable');
            const spinner = document.getElementById('case-study-spinner');
            
            projectItems.forEach(item => {
                item.addEventListener('click', () => {
                    const projectId = item.getAttribute('data-project');
                    const assets = projects[projectId];
                    
                    if (assets) {
                        // Clear previous content and reset opacity
                        caseStudyContent.innerHTML = '';
                        caseStudyContent.style.opacity = '0';
                        spinner.style.display = 'block';
                        
                        // Show overlay immediately so the spinner is visible
                        caseStudyOverlay.classList.remove('hidden');
                        caseStudyOverlay.classList.add('visible');
                        document.body.style.overflow = 'hidden'; // Prevent body scrolling
                        caseStudyOverlay.scrollTo(0,0);
                        
                        let firstMediaLoaded = false;
                        const onMediaLoad = () => {
                            if (!firstMediaLoaded) {
                                firstMediaLoaded = true;
                                spinner.style.display = 'none';
                                caseStudyContent.style.opacity = '1';
                            }
                        };
                        
                        // Inject new assets
                        assets.forEach((assetPath, index) => {
                            if (assetPath.toLowerCase().endsWith('.mp4')) {
                                const video = document.createElement('video');
                                video.src = assetPath;
                                video.autoplay = true;
                                video.loop = true;
                                video.muted = true;
                                video.playsInline = true;
                                if (index === 0) video.onloadeddata = onMediaLoad;
                                caseStudyContent.appendChild(video);
                            } else {
                                const img = document.createElement('img');
                                img.src = assetPath;
                                img.alt = "Case Study Image";
                                // Removed loading="lazy" so all images preload in the background
                                if (index === 0) img.onload = onMediaLoad;
                                caseStudyContent.appendChild(img);
                            }
                        });
                        
                        // Fallback just in case the first media takes too long or fails
                        setTimeout(onMediaLoad, 3000);
                    }
                });
            });
            
            // Close logic
            closeBtn.addEventListener('click', () => {
                caseStudyOverlay.classList.remove('visible');
                // Wait for CSS transition to finish before hiding and clearing
                setTimeout(() => {
                    caseStudyOverlay.classList.add('hidden');
                    caseStudyContent.innerHTML = ''; // free memory
                    caseStudyContent.style.opacity = '0';
                    spinner.style.display = 'none';
                    document.body.style.overflow = ''; // restore body scroll
                }, 500); // matches CSS transition duration
            });
        });
    </script>
</body>
</html>
